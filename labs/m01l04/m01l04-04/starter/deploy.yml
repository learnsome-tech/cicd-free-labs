name: deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        description: where to deploy
        type: choice
        options: [staging, production]
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: show the target
        env:
          TARGET: ${{ inputs.environment }}
        run: echo "deploying to $TARGET"
