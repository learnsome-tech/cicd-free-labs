name: app-ci
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - '.github/workflows/app-ci.yml'
  pull_request:
    branches-ignore: ['experiment/**']
    paths-ignore:
      - 'docs/**'
      - '**.md'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: run the tests
        run: bash tests/run.sh
