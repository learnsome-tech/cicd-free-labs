name: pipeline
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: record what woke us
        env:
          EVENT: ${{ github.event_name }}
        run: echo "started by $EVENT" >> "$GITHUB_STEP_SUMMARY"
      - name: show the summary
        run: cat "$GITHUB_STEP_SUMMARY"
