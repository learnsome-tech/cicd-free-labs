name: pipeline
on:
  push:
    branches: [main]
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: test
        run: bash tests/run.sh
      - name: build
        run: |
          mkdir -p dist
          cp app/main.py dist/main.py
      - name: package
        run: tar -cf dist/app.tar -C dist main.py
