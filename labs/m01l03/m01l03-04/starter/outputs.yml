name: outputs
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - id: meta
        name: decide the tag
        run: echo "tag=1.4.0" >> "$GITHUB_OUTPUT"
      - name: read it back in the same job
        run: echo "packaging app:${{ steps.meta.outputs.tag }}"
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: read it in another job
        run: echo "deploying ${{ needs.build.outputs.tag }}"
