name: build
on: push
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: run the tests
        run: bash tests/run.sh
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: build the tarball
        run: |
          mkdir -p dist
          cp app/main.py dist/main.py
          tar -cf dist/app.tar -C dist main.py
